<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Country Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h3>Country Explorer (Legacy Data Source)</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/countries}" method="get" class="row g-3">
                <div class="col-auto">
                    <input type="text" name="name" class="form-control" placeholder="Enter Country Name (e.g. Albania)">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>

            <hr>

            <div th:if="${country}" class="mt-4">
                <h4>Results for: <span th:text="${country.name}"></span></h4>
                <table class="table table-bordered mt-2">
                    <tr><th>Capital</th><td th:text="${country.capital}"></td></tr>
                    <tr><th>Population</th><td th:text="${country.population}"></td></tr>
                    <tr><th>Currency</th><td th:text="${country.currency}"></td></tr>
                </table>
            </div>

            <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
        </div>
        <div class="card-footer">
            <a href="/dashboard" class="btn btn-secondary btn-sm">Back to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
